services:
  - type: web
    name: sanjuan-ai-ki-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SANJUAN_ENV
        value: production
      - key: SANJUAN_CORS_ORIGINS
        sync: false
      - key: SANJUAN_CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: SANJUAN_RATE_LIMIT_ENABLED
        value: "true"
      - key: SANJUAN_ASK_RATE_LIMIT_PER_MINUTE
        value: "30"
